<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fcf8ee" />
    <meta name="description" content="Green Days — a farmers-market companion. The season sets the palette, you tap your basket, one confident recipe comes back." />
    <meta name="p:domain_verify" content="b88174c00c061ee351a5de71ab0c5d34"/>
    <title>green days</title>

    <!-- Self-referential canonical. The shell is only ever served at "/" (no SPA
         fallback — unknown paths return a real 404), so this is safe to hardcode.
         Every generated field-guide and market-year page emits its own canonical
         in scripts/build-field-guide.mjs; this file was the one gap. -->
    <link rel="canonical" href="https://greendays.day/" />

    <!-- Open Graph / social unfurl (absolute URLs required) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="green days" />
    <meta property="og:title" content="green days" />
    <meta property="og:description" content="A farmers-market companion. The season sets the palette, you tap your basket, one confident recipe comes back." />
    <meta property="og:url" content="https://greendays.day/" />
    <meta property="og:image" content="https://greendays.day/assets/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="green days — a linocut still-life of summer market produce" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="green days" />
    <meta name="twitter:description" content="A farmers-market companion. The season sets the palette, you tap your basket, one confident recipe comes back." />
    <meta name="twitter:image" content="https://greendays.day/assets/og.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- &nbsp; keeps iOS autocorrect from turning the home-screen name into "Green Day's". -->
    <meta name="apple-mobile-web-app-title" content="green&nbsp;days" />
    <!-- Cloudflare Web Analytics: no script tag needed. Real User Monitoring is
         enabled zone-wide for greendays.day (dashboard → Speed → Real user
         monitoring → "Enable Globally", done 2026-07-19) — Cloudflare's edge
         auto-injects the beacon into every HTML response for the zone. The old
         manual <script data-cf-beacon> tag (tied to the retired
         lab.ryantnance.com site token) was removed here to avoid double-
         counting / mis-attributed traffic. -->
  </head>
  <body>
    <div id="root"></div>
    <!-- The one crawlable link out of the app shell.

         Until 2026-08-06 this document contained no <a> at all, so Googlebot
         crawled the homepage, found nothing to follow, and stopped: `site:`
         returned one indexed URL out of twenty-three. The field guide's own
         "read more" links are rendered by React and are not in the served
         markup, so they cannot be the discovery path.

         It lives in <noscript> on purpose. #root is min-height:100%, so a
         visible footer would sit below the app and read as a layout bug in
         standalone/PWA mode — and this genuinely serves the no-JS visitor,
         who is exactly the reader the static field guide was built for.
         sitemap.xml is the primary discovery route; this is the fallback that
         does not depend on a sitemap fetch succeeding. -->
    <noscript>
      <nav>
        <p>green days needs JavaScript to build a recipe. The field guide does not:</p>
        <ul>
          <li><a href="/season/">What&rsquo;s in season now</a> — the almanac, and the index to every field-guide entry</li>
          <li><a href="/market-year/">The market year</a> — the twenty-four turning days, each with its date and what is on the stall</li>
        </ul>
      </nav>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
