  :root{
    --floral:#fcf8ee; --indigo:#1f3661; --paprika:#b23c1a;
    --seagrass:#529d7f; --slate:#4d606b;
    /* SUBST_* are swapped in only for the offline preview render */
    --sans:'Nunito', system-ui, sans-serif;
    --script:'Annie Use Your Telescope', cursive;
    --mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px}
  body{background:var(--floral);font-family:var(--sans);
       -webkit-font-smoothing:antialiased;overflow:hidden}
  .frame{position:absolute;inset:20px;border:1.5px solid var(--indigo);border-radius:3px;
         padding:24px 42px 20px;display:flex;flex-direction:column}
  .top{display:flex;justify-content:space-between;align-items:baseline;
       font-family:var(--mono);font-size:11px;font-weight:600;
       letter-spacing:.16em;text-transform:uppercase;color:var(--slate)}
  .top .r{opacity:.75}
  .head{text-align:center;margin-top:10px}
  h1{font-size:54px;font-weight:800;color:var(--indigo);letter-spacing:-.02em;line-height:1}
  .script{font-family:var(--script);font-size:36px;color:var(--paprika);
          margin-top:1px;line-height:1}
  .rule{height:1px;background:#1f366122;margin:16px 0 4px}
  .grid{flex:1;display:grid;grid-auto-flow:column;
        grid-template-rows:repeat(6,1fr);grid-template-columns:repeat(4,1fr);
        column-gap:30px}
  .row{display:flex;align-items:center;gap:9px;
       border-bottom:1px solid #1f366114}
  .num{font-family:var(--mono);font-size:9.5px;font-weight:600;
       color:var(--slate);opacity:.7;width:36px;letter-spacing:.06em;text-align:right}
  .nm{font-size:16px;color:var(--indigo);white-space:nowrap;overflow:hidden;
      text-overflow:ellipsis;flex:1}
  .great .nm{font-weight:700}
  .dot{width:5px;height:5px;border-radius:50%;background:var(--paprika);
       display:inline-block;vertical-align:middle;margin:-2px 4px 0 0}
  .dt{font-family:var(--mono);font-size:10.5px;color:var(--slate);
      letter-spacing:.03em;opacity:.85}
  .foot{display:flex;justify-content:space-between;align-items:center;
        margin-top:14px;font-family:var(--mono);font-size:10px;
        letter-spacing:.14em;text-transform:uppercase;color:var(--slate)}
  .brand{font-family:var(--sans);font-size:16px;font-weight:800;color:var(--seagrass);
         letter-spacing:0;text-transform:none}
</style></head>
<body>
<div class="frame">
  <div class="top"><span>green days</span><span class="r">greendays.day/market-year</span></div>
  <div class="head">
    <h1>The market year</h1>
    <div class="script">twenty-four turning days</div>
  </div>
  <div class="rule"></div>
  <div class="grid" id="g"></div>
  <div class="foot">
    <span>seven to twenty-five days each &middot; 365 in all</span>
    <span class="brand">green&nbsp;days</span>
  </div>
</div>
<script id="data" type="application/json">[{"n":"I","name":"Candlemas","opens":"02-02","great":true},{"n":"II","name":"St Valentine","opens":"02-14","great":false},{"n":"III","name":"St David","opens":"03-01","great":false},{"n":"IV","name":"Lady Day","opens":"03-25","great":true},{"n":"V","name":"Cuckoo Day","opens":"04-14","great":false},{"n":"VI","name":"St George / Sant Jordi","opens":"04-23","great":false},{"n":"VII","name":"May Day","opens":"05-01","great":true},{"n":"VIII","name":"Cold Sophia","opens":"05-15","great":false},{"n":"IX","name":"St Médard","opens":"06-08","great":false},{"n":"X","name":"Midsummer / São João","opens":"06-24","great":true},{"n":"XI","name":"St Swithin","opens":"07-15","great":false},{"n":"XII","name":"Santiago","opens":"07-25","great":false},{"n":"XIII","name":"Lammas","opens":"08-01","great":true},{"n":"XIV","name":"St Bartholomew","opens":"08-24","great":false},{"n":"XV","name":"Marymas","opens":"09-08","great":false},{"n":"XVI","name":"Michaelmas","opens":"09-29","great":true},{"n":"XVII","name":"Old Michaelmas","opens":"10-10","great":false},{"n":"XVIII","name":"St Luke","opens":"10-18","great":false},{"n":"XIX","name":"All Hallows","opens":"11-01","great":true},{"n":"XX","name":"Martinmas / São Martinho","opens":"11-11","great":false},{"n":"XXI","name":"St Nicholas","opens":"12-06","great":false},{"n":"XXII","name":"Christmas","opens":"12-25","great":true},{"n":"XXIII","name":"Epiphany","opens":"01-06","great":false},{"n":"XXIV","name":"St Vincent","opens":"01-22","great":false}]</script>
<script>
const days=JSON.parse(document.getElementById('data').textContent);
const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmt=(o)=>{const[m,d]=o.split('-').map(Number);return d+' '+M[m-1];};
const short=(n)=>n.split(' / ')[0];
const g=document.getElementById('g');
for(const d of days){
  const el=document.createElement('div');
  el.className='row'+(d.great?' great':'');
  el.innerHTML='<span class="num">'+d.n+'</span>'+
    '<span class="nm">'+(d.great?'<span class="dot"></span>':'')+short(d.name)+'</span>'+
    '<span class="dt">'+fmt(d.opens)+'</span>';
  g.appendChild(el);
}
</script>
</body></html>
