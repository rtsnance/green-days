  GOVERNING DOC: Turning_Day_Card_Template_Law.md (incl. §E, 2026-08-03).
  Data verified against turning-days.json: 24 slots, 8 great turns, 7–25 days, sum 365.
  Output 1600x2400. Headless Chromium, dsf 1, shoot after body[data-ready=1].

    npm i playwright

   - No plate field (this card indexes the year, it does not report a season).

let _s = 20260203;
function rnd(){ _s = (_s * 1664525 + 1013904223) % 4294967296; return _s / 4294967296; }
const INK = '#1f3661', MUTED = '#4d606b';

function jitterPolyline(ctx, pts, {passes=3, jitter=2.0, color=INK, lineWidth=3, seg=150, close=false}={}){
  ctx.strokeStyle=color; ctx.lineWidth=lineWidth; ctx.lineJoin='round'; ctx.lineCap='round';
  for(let p=0;p<passes;p++){
    ctx.globalAlpha = p===0 ? 1 : 0.35;
    const j = () => (rnd()-0.5)*jitter*2;
    ctx.beginPath();
    const path = close ? pts.concat([pts[0]]) : pts;
    let started=false;
    for(let i=0;i<path.length-1;i++){
      const [x1,y1]=path[i], [x2,y2]=path[i+1];
      const len=Math.hypot(x2-x1,y2-y1), n=Math.max(1,Math.round(len/seg));
      for(let k=0;k<=n;k++){
        const t=k/n, x=x1+(x2-x1)*t+j(), y=y1+(y2-y1)*t+j();
        if(!started){ ctx.moveTo(x,y); started=true; } else ctx.lineTo(x,y);
      }
    }
    ctx.stroke();
  }
  ctx.globalAlpha=1;
}
function drawInkedRect(ctx,x,y,w,h,o={}){ jitterPolyline(ctx,[[x,y],[x+w,y],[x+w,y+h],[x,y+h]],{close:true,...o}); }
function drawInkedCircle(ctx,cx,cy,r,{passes=3,jitter=1.2,color=INK,lineWidth=2}={}){
  ctx.strokeStyle=color; ctx.lineWidth=lineWidth;
  for(let p=0;p<passes;p++){
    ctx.globalAlpha = p===0?1:0.35;
    const j=()=>(rnd()-0.5)*jitter*2;
    ctx.beginPath(); ctx.arc(cx+j(),cy+j(),r,0,Math.PI*2); ctx.stroke();
  }
  ctx.globalAlpha=1;
}
function drawInkedLine(ctx,x1,y1,x2,y2,o={}){ jitterPolyline(ctx,[[x1,y1],[x2,y2]],{passes:2,jitter:1.3,lineWidth:2,seg:120,...o}); }
function dottedDivider(ctx,x1,y,x2){
  ctx.save();
  ctx.setLineDash([3,10]); ctx.globalAlpha=0.5; ctx.strokeStyle=MUTED; ctx.lineWidth=2;
  ctx.beginPath();
  const n=Math.round((x2-x1)/60);
  for(let k=0;k<=n;k++){
    const t=k/n, x=x1+(x2-x1)*t, yy=y+(rnd()-0.5)*1.8;
    if(k===0) ctx.moveTo(x,yy); else ctx.lineTo(x,yy);
  }
  ctx.stroke(); ctx.restore();
}
function arcText(ctx,text,cx,cy,r,startAng,endAng,{font,color=INK,flip=false}={}){
  ctx.save(); ctx.font=font; ctx.fillStyle=color; ctx.textAlign='center'; ctx.textBaseline='middle';
  const chars=[...text], widths=chars.map(c=>ctx.measureText(c).width);
  const total=widths.reduce((a,b)=>a+b,0), span=endAng-startAng;
  let acc=0;
  chars.forEach((c,i)=>{
    const a=startAng+span*((acc+widths[i]/2)/total); acc+=widths[i];
    ctx.save();
    ctx.translate(cx+Math.cos(a)*r, cy+Math.sin(a)*r);
    ctx.rotate(flip ? a-Math.PI/2 : a+Math.PI/2);
    ctx.fillText(c,0,0);
    ctx.restore();
  });
  ctx.restore();
}

  ctx.fillStyle=MUTED; ctx.font='500 25px "JetBrains Mono"';
  ctx.fillText('365 DAYS',cx,cy+59);
  ctx.restore();

  dottedDivider(ctx,M,796,W-M);
  /* the spine between the half-years */
  drawInkedLine(ctx,W/2,838,W/2,2126,{color:MUTED,jitter:1.1,seg:140});
  dottedDivider(ctx,M,2170,W-M);
}

document.fonts.ready.then(()=>{ draw(); document.body.dataset.ready='1'; });
</script>
